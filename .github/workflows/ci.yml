name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.401
      - name: Restore
        run: dotnet restore ORelay.sln
      - name: Check formatting
        run: dotnet format ORelay.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ORelay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ORelay.sln --configuration Release --no-restore --no-build
      - name: Check versioning contracts
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-versioning.ps1
